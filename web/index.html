<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAG Assistant</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2430; --muted: #667085; --border: #e4e7ec;
      --accent: #1e8e3e; --accent-soft: #e8f5ec; --upload: #1a73e8; --error: #c5221f; --user: #eef3fd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151a; --panel: #1b1f26; --text: #e6e8eb; --muted: #98a2b3; --border: #2c323c;
        --accent: #4cc26b; --accent-soft: #1d3326; --upload: #6ea8fe; --error: #f28b82; --user: #1f2a3d;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
    header h1 { font-size: 18px; margin: 0; }
    header small { color: var(--muted); }
    main { max-width: 880px; margin: 0 auto; padding: 24px 16px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
    input[type=email], input[type=password], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit;
    }
    textarea { resize: vertical; min-height: 60px; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    button.upload { background: var(--upload); }
    button:disabled { opacity: .5; cursor: wait; }
    .row { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; flex-wrap: wrap; }
    .row > :first-child { flex: 1; }
    .error { color: var(--error); font-size: 14px; min-height: 20px; margin-top: 8px; }
    .hidden { display: none; }
    #chat { display: flex; flex-direction: column; gap: 12px; max-height: 55vh; overflow-y: auto; margin-bottom: 4px; }
    .msg { padding: 12px 14px; border-radius: 10px; max-width: 90%; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--user); }
    .msg.bot { align-self: flex-start; background: var(--accent-soft); }
    .msg.bot.err { background: transparent; border: 1px solid var(--error); color: var(--error); }
    .meta { margin-top: 8px; font-size: 13px; color: var(--muted); white-space: normal; }
    .meta .src { display: inline-block; margin: 2px 6px 0 0; padding: 1px 8px; border: 1px solid var(--border); border-radius: 999px; }
    #uploadStatus { font-size: 14px; margin-top: 10px; }
    .ok { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RAG Assistant</h1>
      <small>Bedrock Knowledge Bases · S3 Vectors · Lambda · API Gateway · Cognito</small>
    </div>
    <div id="userBox" class="hidden">
      <small id="userEmail"></small>
      <button class="secondary" id="logoutBtn">Sign out</button>
    </div>
  </header>

  <main>
    <!-- Login -->
    <section class="card" id="loginCard">
      <h2>Sign in</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
        <div class="row"><span></span><button type="submit" id="loginBtn">Sign in</button></div>
        <div class="error" id="loginError"></div>
      </form>
    </section>

    <!-- App -->
    <section id="app" class="hidden">
      <div class="card">
        <h2>Ask the documents</h2>
        <div id="chat"></div>
        <form id="askForm" class="row">
          <textarea id="question" maxlength="1000" placeholder="e.g. How many vacation days do employees get after 5 years?" required></textarea>
          <button type="submit" id="askBtn">Ask</button>
        </form>
      </div>

      <div class="card">
        <h2>Upload a document</h2>
        <div class="row">
          <input type="file" id="file" accept=".pdf,.md,.txt,.docx,.html,.csv" />
          <button class="upload" id="uploadBtn">Upload</button>
        </div>
        <div id="uploadStatus"></div>
        <div class="meta">PDF, Markdown, TXT, DOCX, HTML or CSV · max 5 MB · it becomes searchable about 2 minutes after the upload.</div>
      </div>
    </section>
  </main>

  <!-- Generated by serve.py from web/.env (never committed) -->
  <script src="config.js"></script>
  <script>
    // ---- Configuration: region, Cognito client ID and API URL come from web/.env ----
    const CONFIG = { ...(window.APP_CONFIG || {}), maxUploadBytes: 5 * 1024 * 1024 };
    if (!CONFIG.clientId || !CONFIG.apiUrl) {
      document.querySelector("main").innerHTML =
        '<section class="card"><h2>Missing configuration</h2><p>Create <code>web/.env</code> from <code>web/.env.example</code> and start the page with <code>python serve.py</code>.</p></section>';
      throw new Error("Missing configuration (web/.env)");
    }

    const $ = (id) => document.getElementById(id);
    const session = {
      get token() { return sessionStorage.getItem("idToken"); },
      set(token, email) { sessionStorage.setItem("idToken", token); sessionStorage.setItem("email", email); },
      clear() { sessionStorage.clear(); },
    };

    // ---- Auth: Cognito InitiateAuth (USER_PASSWORD_AUTH, lab only: see ADR 0007) ----
    async function signIn(email, password) {
      const res = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-amz-json-1.1",
          "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
        },
        body: JSON.stringify({
          AuthFlow: "USER_PASSWORD_AUTH",
          ClientId: CONFIG.clientId,
          AuthParameters: { USERNAME: email, PASSWORD: password },
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || "Sign-in failed.");
      if (!data.AuthenticationResult) throw new Error(`Extra step required: ${data.ChallengeName}`);
      return data.AuthenticationResult.IdToken;
    }

    // ---- API calls (the ID token goes in the Authorization header) ----
    async function api(path, body) {
      const res = await fetch(`${CONFIG.apiUrl}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: session.token },
        body: JSON.stringify(body),
      });
      if (res.status === 401) { signOut("Your session expired. Please sign in again."); throw new Error("Session expired."); }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
      return data;
    }

    // ---- UI helpers ----
    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function renderAnswer(text) {
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }
    function addMessage(kind, html) {
      const div = document.createElement("div");
      div.className = `msg ${kind}`;
      div.innerHTML = html;
      $("chat").appendChild(div);
      $("chat").scrollTop = $("chat").scrollHeight;
      return div;
    }
    function showApp(show) {
      $("loginCard").classList.toggle("hidden", show);
      $("app").classList.toggle("hidden", !show);
      $("userBox").classList.toggle("hidden", !show);
      $("userEmail").textContent = show ? sessionStorage.getItem("email") : "";
    }
    function signOut(message = "") {
      session.clear();
      showApp(false);
      $("loginError").textContent = message;
    }

    // ---- Events ----
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginBtn").disabled = true; $("loginError").textContent = "";
      try {
        const email = $("email").value.trim();
        session.set(await signIn(email, $("password").value), email);
        $("password").value = "";
        showApp(true);
      } catch (err) {
        $("loginError").textContent = err.message;
      } finally {
        $("loginBtn").disabled = false;
      }
    });

    $("logoutBtn").addEventListener("click", () => signOut());

    $("askForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = $("question").value.trim();
      if (!question) return;
      addMessage("user", escapeHtml(question));
      $("question").value = ""; $("askBtn").disabled = true;
      const pending = addMessage("bot", "Thinking…");
      try {
        const data = await api("/query", { question });
        const sources = data.sources.length
          ? data.sources.map((s) => `<span class="src">[${s.id}] ${escapeHtml(s.file)} · ${s.score}</span>`).join("")
          : "no sources: the question is outside the documents";
        const usage = data.usage ? ` · ${data.usage.inputTokens} in / ${data.usage.outputTokens} out tokens` : " · LLM not called";
        pending.innerHTML = `${renderAnswer(data.answer)}<div class="meta">${sources}${usage}</div>`;
      } catch (err) {
        pending.className = "msg bot err";
        pending.textContent = err.message;
      } finally {
        $("askBtn").disabled = false;
      }
    });

    $("question").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("askForm").requestSubmit(); }
    });

    $("uploadBtn").addEventListener("click", async () => {
      const file = $("file").files[0];
      const status = $("uploadStatus");
      if (!file) { status.innerHTML = '<span class="error">Choose a file first.</span>'; return; }
      if (file.size > CONFIG.maxUploadBytes) { status.innerHTML = '<span class="error">The file is larger than 5 MB.</span>'; return; }
      $("uploadBtn").disabled = true;
      status.textContent = "Requesting upload URL…";
      try {
        // 1. Ask our API for a pre-signed POST (ADR 0008)
        const presigned = await api("/upload-url", { fileName: file.name });
        // 2. Upload straight to S3. The signed fields go first, the file must be the last field.
        status.textContent = "Uploading to S3…";
        const form = new FormData();
        Object.entries(presigned.fields).forEach(([k, v]) => form.append(k, v));
        form.append("file", file);
        const res = await fetch(presigned.url, { method: "POST", body: form });
        if (!res.ok) throw new Error(`S3 rejected the upload (HTTP ${res.status}).`);
        status.innerHTML = `<span class="ok">✓ Uploaded as <code>${escapeHtml(presigned.key)}</code>. It will be searchable in about 2 minutes.</span>`;
        $("file").value = "";
      } catch (err) {
        status.innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
      } finally {
        $("uploadBtn").disabled = false;
      }
    });

    showApp(Boolean(session.token));
  </script>
</body>
</html>
